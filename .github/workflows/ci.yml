name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ComandasApp
    steps:
      - uses: actions/checkout@v3
      
      - name: Setup .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '8.0.x'
          
      - name: Restore dependencies
        run: dotnet restore
        
      - name: Build
        run: dotnet build --no-restore
        
      - name: Test
        run: dotnet test --no-build --verbosity normal

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v3
      
      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'
          
      - name: Install dependencies
        run: npm ci
        
      - name: Build
        run: npm run build
        
      - name: Test
        run: npm run test:coverage

  docker:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v3
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
        
      - name: Build and test Docker containers
        run: |
          docker compose build
          docker compose up -d
          
          # Wait for services to be ready
          echo "Waiting for services to start..."
          sleep 60
          
          # Test API with retry logic
          echo "Testing API endpoint..."
          for i in {1..10}; do
            if curl -f http://localhost:5001/api/mesas; then
              echo "✅ API is responding!"
              break
            else
              echo "⏳ Attempt $i: API not ready yet, waiting..."
              sleep 10
            fi
          done
          
          # Test frontend
          echo "Testing frontend..."
          if curl -f http://localhost:3000; then
            echo "✅ Frontend is responding!"
          else
            echo "❌ Frontend test failed"
            exit 1
          fi
          
          # Test nginx proxy
          echo "Testing nginx proxy..."
          if curl -f http://localhost:80; then
            echo "✅ Nginx proxy is working!"
          else
            echo "❌ Nginx proxy test failed"
            exit 1
          fi
          
          docker compose down 