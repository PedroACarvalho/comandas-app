services:
  # API .NET
  api:
    build:
      context: ./ComandasApp
      dockerfile: docker/Dockerfile
    ports:
      - "5001:5001"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:5001
    volumes:
      - ./ComandasApp/src/ComandasApp.API/comandas.db:/app/comandas.db
    networks:
      - comandas-network

  # Frontend React
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    ports:
      - "3000:80"
    depends_on:
      - api
    networks:
      - comandas-network

  # Nginx (Proxy reverso)
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - api
      - frontend
    networks:
      - comandas-network

networks:
  comandas-network:
    driver: bridge
